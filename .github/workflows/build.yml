# The Windows build.
#
# One runner, one job. Tauri links against the platform's own webview, so a bundle can only be
# produced on the OS it targets: there is no cross-compilation route to Windows, and nothing
# else is built here.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 11, because `pnpm-workspace.yaml` uses `allowBuilds`, which is pnpm 11 syntax. Under 9
      # the file parses as a workspace manifest with no `packages` field and the install refuses
      # to start.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/desktop/ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `cargo tauri build` runs `pnpm build` itself through `beforeBuildCommand`, but the
      # install has to happen first — and a frozen-lockfile install is also the check that the
      # lockfile is current.
      - name: Frontend dependencies
        working-directory: crates/desktop/ui
        run: pnpm install --frozen-lockfile

      - name: CLI
        run: cargo build --release -p newsbuilder-cli

      # Built from source, and the slowest step here. rust-cache keeps the resulting binary
      # between runs, so only the first one pays for it.
      - name: Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Desktop installer
        working-directory: crates/desktop
        run: cargo tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: newsbuilder-windows
          path: |
            target/release/newsbuilder.exe
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

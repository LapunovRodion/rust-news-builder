[package]
name = "newsbuilder-core"
description = "Domain rules for News Builder: import, arrange, render, publish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Lossy WebP needs libwebp (plan.md Complexity Tracking). The crate builds without it;
# a .webp source then cannot be re-encoded to the byte budget.
default = ["webp-lossy"]
webp-lossy = ["dep:webp"]
# The SFTP transport adapter. Off by default so the domain rules — and every parity test —
# compile with no async runtime and no network stack. Both frontends turn it on.
sftp = ["dep:russh", "dep:russh-sftp", "dep:tokio"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
quick-xml.workspace = true
image.workspace = true
kamadak-exif.workspace = true
webp = { workspace = true, optional = true }
unicode-normalization.workspace = true
url.workspace = true
directories.workspace = true
time.workspace = true
keyring.workspace = true
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions.workspace = true
serde_json.workspace = true
url.workspace = true

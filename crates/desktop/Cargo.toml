[package]
name = "newsbuilder-desktop"
description = "Tauri desktop application for News Builder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# Tauri's mobile targets expect the application to be reachable as a library. Keeping the
# binary a thin shell over `lib.rs` also means the commands can be unit-tested.
name = "newsbuilder_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "newsbuilder-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
newsbuilder-core = { workspace = true, features = ["sftp"] }
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-fs.workspace = true
tauri-plugin-clipboard-manager.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
time.workspace = true
percent-encoding.workspace = true

[dev-dependencies]
# The publish command runs on Tauri's async runtime; the regression test for that has to stand
# one up too.
tokio.workspace = true
